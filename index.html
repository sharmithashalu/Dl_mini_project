    // AUDIO & SPEECH SYNTHESIS ENGINE
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.speechEnabled = true;
        this.audioEnabled = true;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'sine', duration = 0.2, vol = 0.15) {
        if (!this.audioEnabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn('Audio tone err:', e);
        }
      }
      playAlarmSiren() {
        if (!this.audioEnabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.linearRampToValueAtTime(880, now + 0.35);
          osc.frequency.linearRampToValueAtTime(440, now + 0.7);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.7);
        } catch (e) {
          console.warn('Alarm audio err:', e);
        }
      }
      playClick() {
        this.playTone(800, 'triangle', 0.05, 0.08);
      }
      playWarningBeep() {
        this.playTone(520, 'square', 0.18, 0.15);
      }
      speak(text) {
        if (!this.speechEnabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.05;
          utterance.pitch = 0.95;
          utterance.volume = 0.9;
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn('Speech synthesis err:', e);
        }
      }

    // ==========================================

    function GasGuardApp() {
      const [state, setState] = useState(INITIAL_STATE);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isSimDrawerOpen, setIsSimDrawerOpen] = useState(false);
      const [isXaiModalOpen, setIsXaiModalOpen] = useState(false);
      const [xaiTopic, setXaiTopic] = useState('risk');
      const [soundMuted, setSoundMuted] = useState(false);
      const [speechMuted, setSpeechMuted] = useState(false);
      const [systemTime, setSystemTime] = useState(new Date().toLocaleTimeString());
      const [whatIfResults, setWhatIfResults] = useState(null);

      // Keep sounds synced with state
      useEffect(() => {
        sound.audioEnabled = !soundMuted;
        sound.speechEnabled = !speechMuted;
      }, [soundMuted, speechMuted]);

      // Clock ticker
      useEffect(() => {
        const timer = setInterval(() => {
          setSystemTime(new Date().toLocaleTimeString());
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Live simulated telemetry jitter (realistic industrial sensor fluctuation)
      useEffect(() => {
        if (!state.liveStreamEnabled || state.emergencySimActive) return;
        const interval = setInterval(() => {
          setState(prev => {
            const jitterGas = Number((Math.sin(Date.now() / 3000) * 1.2).toFixed(1));
            const jitterPressure = Number((Math.cos(Date.now() / 4000) * 0.03).toFixed(2));
            const jitterTemp = Number((Math.sin(Date.now() / 5000) * 0.15).toFixed(1));
            const jitterVib = Number((Math.cos(Date.now() / 2500) * 0.08).toFixed(2));

            // Dynamic Sensor responses with slight random noise
            const updatedSensors = prev.sensors.map(s => {
              if (prev.sensorFaultSimulated && s.id === 4) {
                return { ...s, reading: 22, trust: 42, status: 'Fault Detected' };
              }
              const noise = Math.floor((Math.random() - 0.5) * 4);
              return { ...s, reading: Math.max(10, s.baseline + Math.round(prev.gasConcentration * 0.6) + noise) };
            });

            return {
              ...prev,
              gasConcentration: Math.max(5, Number((prev.gasConcentration + jitterGas).toFixed(1))),
              pressure: Math.max(0.5, Number((prev.pressure + jitterPressure).toFixed(2))),
              temperature: Math.max(10, Number((prev.temperature + jitterTemp).toFixed(1))),
              vibration: Math.max(0.2, Number((prev.vibration + jitterVib).toFixed(2))),
              sensors: updatedSensors,
            };
          });
        }, 2500);
        return () => clearInterval(interval);
      }, [state.liveStreamEnabled, state.emergencySimActive, state.sensorFaultSimulated]);

      // Dynamic Risk Calculation
      const currentRisk = useMemo(() => {
        const ppm = state.gasConcentration;
        const vib = state.vibration;
        const press = state.pressure;
        const valveHealth = state.equipment.find(e => e.id === 'V-101')?.health || 64;

        let score = 20; // baseline
        if (ppm > 25) score += Math.min(45, (ppm - 25) * 0.35);
        if (vib > 2.0) score += Math.min(20, (vib - 2.0) * 4.5);
        if (press > 2.8) score += Math.min(15, (press - 2.8) * 8.0);
        if (valveHealth < 75) score += (75 - valveHealth) * 0.4;
        
        score = Math.min(98, Math.max(15, Math.round(score)));

        let level = 'Normal';
        let color = '#10b981';
        let badgeClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40';
        let icon = '🟢';

        if (score >= 80) {
          level = 'Critical';
          color = '#ef4444';
          badgeClass = 'bg-red-500/20 text-red-400 border-red-500/40 animate-pulse';
          icon = '🔴';
        } else if (score >= 65) {
          level = 'High Risk';
          color = '#f97316';
          badgeClass = 'bg-orange-500/20 text-orange-400 border-orange-500/40';
          icon = '🟠';
        } else if (score >= 40) {
          level = 'Warning';
          color = '#f59e0b';
          badgeClass = 'bg-amber-500/20 text-amber-400 border-amber-500/40';
          icon = '🟡';
        }

        return { score, level, color, badgeClass, icon };
      }, [state.gasConcentration, state.vibration, state.pressure, state.equipment]);

      // Calculate dynamic Resilience Score
      const computedResilience = useMemo(() => {
        let alarmScore = state.primaryAlarmHealth === 'FAILED' ? 45 : 85;
        let sensorScore = state.sensorFaultSimulated ? 65 : 88;
        let equipAvg = Math.round(state.equipment.reduce((acc, e) => acc + e.health, 0) / state.equipment.length);
        let gasScore = currentRisk.score > 75 ? 40 : currentRisk.score > 50 ? 68 : 92;
        let workerScore = state.workersExposed > 0 ? 60 : 90;
        let commScore = state.backupAlertsActive ? 95 : 70;

        let total = Math.round((alarmScore * 0.15) + (sensorScore * 0.15) + (equipAvg * 0.2) + (gasScore * 0.2) + (workerScore * 0.15) + (commScore * 0.15));
        total = Math.max(25, Math.min(98, total));
        
        return {
          total,
          layers: [
            { name: 'Gas Detection', score: gasScore, status: gasScore > 75 ? 'Optimal' : 'Elevated' },
            { name: 'Equipment Health', score: equipAvg, status: equipAvg > 75 ? 'Nominal' : 'Attention' },
            { name: 'Sensor Reliability', score: sensorScore, status: sensorScore > 75 ? 'Valid' : 'Fault Detected' },
            { name: 'Alarm Reliability', score: alarmScore, status: state.primaryAlarmHealth === 'FAILED' ? 'Failed (Backup Active)' : 'Healthy' },
            { name: 'Emergency Comm', score: commScore, status: 'Redundant' },
            { name: 'Worker Safety', score: workerScore, status: state.workersExposed > 0 ? 'Hazard Perimeter' : 'Safe' },
          ]
        };
      }, [state.primaryAlarmHealth, state.sensorFaultSimulated, state.equipment, currentRisk.score, state.workersExposed, state.backupAlertsActive]);

      // ==========================================
      // SIMULATION ACTION HANDLERS
      // ==========================================
      const handleSimulateAlarmFailure = () => {
        sound.playClick();
        setState(prev => {
          const isFailing = prev.primaryAlarmHealth === 'HEALTHY';
          if (isFailing) {
            sound.playAlarmSiren();
            sound.speak("Primary alarm failure detected. Autonomous backup emergency response activated. All personnel proceed to evacuation points.");
          }
          return {
            ...prev,
            primaryAlarmHealth: isFailing ? 'FAILED' : 'HEALTHY',
            primaryAlarmState: isFailing ? 'FAILED' : 'ACTIVE',
            primaryAlarmSimulatedFail: isFailing,
            backupAlertsActive: true,
            visualBeaconActive: true,
            workerWearableAlert: true,
            voiceAlertActive: true,
            controlRoomAlert: true,
            safetyLayers: prev.safetyLayers.map(l => l.id === 1 ? { ...l, status: isFailing ? 'FAILED' : 'ACTIVE' } : l),
          };
        });
      };

      const handleToggleSensorFault = () => {
        sound.playClick();
        setState(prev => {
          const newFault = !prev.sensorFaultSimulated;
          if (newFault) {
            sound.playWarningBeep();
            sound.speak("Warning. Sensor S-04 drift detected. Cross-sensor voting engaged.");
          }
          return {
            ...prev,
            sensorFaultSimulated: newFault,
            sensors: prev.sensors.map(s => {
              if (s.id === 4) {
                return newFault 
                  ? { ...s, reading: 22, trust: 42, status: 'Possible Sensor Fault Detected' }
                  : { ...s, reading: 102, trust: 92, status: 'Normal' };
              }
              return s;
            })
          };
        });
      };

      const handleSimulateGasLeak = () => {
        sound.playClick();
        sound.playAlarmSiren();

        if (step > 8) {

            sound.speak("Step 1: Valve V-101 vibration anomaly detected. Pressure fluctuation registered.");

            updated.pressure = 3.1;

            updated.leakConfidence = 96;
          } else if (step === 5) {
            sound.speak("Step 5: Worker exposure algorithm identifies 3 personnel in hazardous perimeter.");
            updated.workersExposed = 3;
          } else if (step === 6) {
            sound.playAlarmSiren();
            sound.speak("Step 6: Primary Alarm verification heartbeat checks siren. Primary alarm is FAILED.");
            updated.primaryAlarmHealth = 'FAILED';
            updated.primaryAlarmState = 'FAILED';

            sound.speak("Step 7: Autonomous Backup Emergency Alert engages. Xenon strobes active. Wearable LoRa buzzers active. Voice evacuation dispatched.");
            updated.backupAlertsActive = true;
            updated.visualBeaconActive = true;
            updated.workerWearableAlert = true;

            updated.workersSafe = 14;
          }

          deltaHealth = -40;
          notes = 'Primary siren silent; system autonomously routes failover through LoRa wearables & visual beacons.';

          deltaGas = 0;
          deltaHealth = -18;
          notes = 'Sensor S-04 trust drops to 42%. Cross-sensor consensus engine isolates faulty sensor.';
          handleToggleSensorFault();
        }

        sound.speak(`What if scenario executed: ${scenarioName}`);
        setWhatIfResults({
          name: scenarioName,
          deltaRisk,
          deltaGas,
          deltaHealth,
          notes,
          timestamp: new Date().toLocaleTimeString()
        });

      return (

          <text x="35" y="262" fill="#64748b" fontSize="10" fontFamily="JetBrains Mono">Gas: {state.zones['Zone C'].gasPpm} PPM &bull; Buffer</text>

          {/* ZONE D: Venting & Flare Bay (Bottom Right) */}
          <rect x="315" y="220" width="265" height="180" rx="10" fill="rgba(16, 185, 129, 0.05)" stroke="#10b981" strokeWidth="1.5" strokeOpacity="0.4" />
          <text x="330" y="245" fill="#10b981" fontSize="12" fontWeight="700" fontFamily="JetBrains Mono">ZONE D: VENTING &amp; FLARE BAY</text>
          <text x="330" y="262" fill="#64748b" fontSize="10" fontFamily="JetBrains Mono">Gas: {state.zones['Zone D'].gasPpm} PPM &bull; Safe</text>

          {/* Dynamic Gas Dispersion Plume in Zone B */}
          {isPlumeCritical && (
            <g transform="translate(440, 110)">
              <circle r="75" fill="url(#gradPlumeCrit)" className="animate-plume" />
              <circle r="30" fill="#ef4444" fillOpacity="0.4" />
              <circle r="6" fill="#ffffff" />
              <text x="12" y="4" fill="#ffffff" fontSize="9" fontWeight="bold" fontFamily="JetBrains Mono">LEAK CENTROID</text>
            </g>
          )}

          {/* Evacuation Route Arrows pointing to West Exit */}
          <path d="M 330 150 L 220 150 L 15 150" fill="none" stroke="#10b981" strokeWidth="2.5" strokeDasharray="6 4" />
          <polygon points="15,145 5,150 15,155" fill="#10b981" />
          <text x="15" y="140" fill="#10b981" fontSize="10" fontWeight="bold" fontFamily="JetBrains Mono">WEST EXIT 2 &larr;</text>

          {/* Equipment Symbols */}
          {/* Valve V-101 in Zone B */}
          <g transform="translate(470, 150)">
            <rect x="-16" y="-14" width="32" height="28" rx="6" fill="#0f172a" stroke="#ef4444" strokeWidth="2" />
            <text x="0" y="4" fill="#ffffff" fontSize="9" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">V-101</text>
          </g>

          {/* Pipeline P-204 in Zone C */}
          <g transform="translate(180, 290)">
            <rect x="-16" y="-14" width="32" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" strokeWidth="2" />
            <text x="0" y="4" fill="#ffffff" fontSize="9" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">P-204</text>
          </g>

          {/* Compressor C-302 in Zone B */}
          <g transform="translate(370, 140)">
            <rect x="-16" y="-14" width="32" height="28" rx="6" fill="#0f172a" stroke="#f59e0b" strokeWidth="2" />
            <text x="0" y="4" fill="#ffffff" fontSize="9" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">C-302</text>
          </g>

          {/* Worker Pins with tooltips and pulsating beacons */}
          {state.workerList.map((w) => (
            <g key={w.id} transform={`translate(${w.x}, ${w.y})`}>
              {w.status === 'Critical' && (
                <circle r="12" fill="#ef4444" fillOpacity="0.5" className="animate-ping" />
              )}
              <circle r="6" fill={w.status === 'Critical' ? '#ef4444' : w.status === 'Warning' ? '#f59e0b' : '#10b981'} stroke="#ffffff" strokeWidth="1.5" />
              <text x="9" y="4" fill="#e2e8f0" fontSize="8" fontWeight="bold" fontFamily="JetBrains Mono">{w.id}</text>
            </g>
          ))}
        </svg>
      );
    }

    // =========================================================================
    // SVG RADAR SIGNATURE COMPONENT (E-NOSE FOOTPRINT)
    // =========================================================================
    function RadarSignatureSvg({ sensors }) {
      const pointsLive = [
        "150,45",
        "225,95",
        "205,190",
        "95,190",
        "75,95",
      ].join(" ");

      const pointsBaseline = [
        "150,90",
        "185,115",
        "170,160",
        "130,160",
        "115,115",
      ].join(" ");

      return (
        <svg viewBox="0 0 300 240" className="w-full max-h-[220px]">
          {/* Concentric Polygons */}
          <polygon points="150,30 245,95 210,210 90,210 55,95" fill="none" stroke="#1e2b4f" strokeWidth="1" />
          <polygon points="150,65 215,110 190,185 110,185 85,110" fill="none" stroke="#1e2b4f" strokeWidth="1" />
          <polygon points="150,100 185,125 170,160 130,160 115,125" fill="none" stroke="#1e2b4f" strokeWidth="1" />

          {/* Axes */}
          <line x1="150" y1="135" x2="150" y2="30" stroke="#1e2b4f" strokeWidth="1" />
          <line x1="150" y1="135" x2="245" y2="95" stroke="#1e2b4f" strokeWidth="1" />
          <line x1="150" y1="135" x2="210" y2="210" stroke="#1e2b4f" strokeWidth="1" />
          <line x1="150" y1="135" x2="90" y2="210" stroke="#1e2b4f" strokeWidth="1" />
          <line x1="150" y1="135" x2="55" y2="95" stroke="#1e2b4f" strokeWidth="1" />

          {/* Baseline Footprint */}
          <polygon points={pointsBaseline} fill="rgba(100, 116, 139, 0.2)" stroke="#64748b" strokeWidth="1.5" strokeDasharray="3 3" />

          {/* Live Footprint */}
          <polygon points={pointsLive} fill="rgba(6, 182, 212, 0.25)" stroke="#06b6d4" strokeWidth="2.5" />

          {/* Labels */}
          <text x="150" y="20" fill="#06b6d4" fontSize="9" fontWeight="bold" textAnchor="middle" fontFamily="JetBrains Mono">S1: NH₃</text>
          <text x="255" y="95" fill="#94a3b8" fontSize="9" fontWeight="bold" fontFamily="JetBrains Mono">S2: COMB</text>
          <text x="220" y="225" fill="#94a3b8" fontSize="9" fontWeight="bold" fontFamily="JetBrains Mono">S3: TOX</text>
          <text x="75" y="225" fill="#94a3b8" fontSize="9" fontWeight="bold" textAnchor="end" fontFamily="JetBrains Mono">S4: PID</text>
          <text x="45" y="95" fill="#94a3b8" fontSize="9" fontWeight="bold" textAnchor="end" fontFamily="JetBrains Mono">S5: MOS</text>
        </svg>
      );
    }

    // =========================================================================
    // SVG RISK TREND LINE GRAPH COMPONENT
    // =========================================================================
    function RiskTrendLineSvg({ currentRisk }) {
      const currentY = Math.max(20, Math.min(180, 200 - (currentRisk * 1.8)));

      return (
        <svg viewBox="0 0 500 200" className="w-full h-full">
          {/* Threshold Zones */}
          <rect x="40" y="10" width="450" height="40" fill="rgba(239, 68, 68, 0.08)" />
          <rect x="40" y="50" width="450" height="40" fill="rgba(249, 115, 22, 0.08)" />
          <rect x="40" y="90" width="450" height="50" fill="rgba(245, 158, 11, 0.08)" />
          <rect x="40" y="140" width="450" height="50" fill="rgba(16, 185, 129, 0.08)" />

          {/* Y Axis Guidelines */}
          <line x1="40" y1="50" x2="490" y2="50" stroke="#ef4444" strokeDasharray="3 3" strokeWidth="1" strokeOpacity="0.4" />
          <text x="35" y="53" fill="#ef4444" fontSize="8" textAnchor="end" fontFamily="JetBrains Mono">80%</text>

          <line x1="40" y1="90" x2="490" y2="90" stroke="#f97316" strokeDasharray="3 3" strokeWidth="1" strokeOpacity="0.4" />
          <text x="35" y="93" fill="#f97316" fontSize="8" textAnchor="end" fontFamily="JetBrains Mono">60%</text>

          <line x1="40" y1="140" x2="490" y2="140" stroke="#10b981" strokeDasharray="3 3" strokeWidth="1" strokeOpacity="0.4" />
          <text x="35" y="143" fill="#10b981" fontSize="8" textAnchor="end" fontFamily="JetBrains Mono">40%</text>

          {/* Trend Line (Past 60 mins -> Rising to Current) */}
          <path
            d={`M 40,165 Q 120,160 180,150 T 260,135 T 340,110 T 420,70 L 480,${currentY}`}
            fill="none"
            stroke="#f59e0b"
            strokeWidth="3"
          />

          {/* Current Risk Point */}
          <circle cx="480" cy={currentY} r="6" fill="#ef4444" className="animate-ping" />
          <circle cx="480" cy={currentY} r="4" fill="#ffffff" />
          <text x="475" y={currentY - 10} fill="#f87171" fontSize="10" fontWeight="bold" textAnchor="end" fontFamily="JetBrains Mono">
            NOW: {currentRisk}%
          </text>
        </svg>
      );
    }

    // ==========================================
    // MOUNT APPLICATION
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GasGuardApp />);
  </script>
</body>
</html>
